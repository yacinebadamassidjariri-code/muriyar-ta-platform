name: Verify Three Pending Migrations (Development)

# ── Purpose ───────────────────────────────────────────────────────────────────
# READ-ONLY verification workflow.
# Checks whether the database effects of migrations 20261001000000,
# 20261001120000, and 20261001130000 are already present in muriyar-ta-dev,
# even though those migrations were never recorded in schema_migrations.
#
# This workflow NEVER:
#   - runs INSERT, UPDATE, or DELETE on any table
#   - modifies schema_migrations
#   - applies, rolls back, or deploys any migration
#   - touches production
#
# WHEN TO RUN:
#   Before deciding to mark the three Oct-1 migrations as applied.
#   Run this, review the artifact, then decide.
#
# HOW TO READ RESULTS:
#   PASS | <id> | description          → check succeeded
#   FAIL | <id> | description | detail → effect missing or different; investigate
#   INFO | <id> | ...                  → manual comparison required (see artifact)

on:
  workflow_dispatch:
    inputs:
      confirmed_project_ref:
        description: >
          Type the dev project ref to confirm target (must match DEV_PROJECT_REF).
        required: true
        type: string

concurrency:
  group: verify-three-migrations-dev
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  verify:
    name: Verify three pending migration effects in muriyar-ta-dev
    runs-on: ubuntu-22.04
    environment: development

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
      DEV_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}

    steps:
      # ── Guard 0: secrets presence check ────────────────────────────────────
      - name: Guard – verify required secrets are present
        run: |
          MISSING=""
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            MISSING="${MISSING} DEV_SUPABASE_ACCESS_TOKEN"
          fi
          if [ -z "$DEV_DB_URL" ]; then
            MISSING="${MISSING} DEV_DB_URL"
          fi
          if [ -z "$DEV_PROJECT_REF" ]; then
            MISSING="${MISSING} DEV_PROJECT_REF"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets are missing or empty:${MISSING}"
            echo "::error::Add these secrets to the 'development' GitHub Environment:"
            echo "::error::  Settings → Environments → development → Environment secrets"
            echo "::error::DEV_SUPABASE_ACCESS_TOKEN: a Supabase personal access token"
            echo "::error::  (account → Access tokens at app.supabase.com)"
            echo "::error::DEV_DB_URL: the direct connection string for the dev project"
            echo "::error::  (project → Settings → Database → Connection string → URI)"
            echo "::error::DEV_PROJECT_REF: the project ref shown in the project URL"
            echo "::error::  (e.g. abcdefghijklmnop from app.supabase.com/project/abcdefghijklmnop)"
            exit 1
          fi
          echo "::notice::All required secrets are present."

      # ── Guard 1: input must match secret ────────────────────────────────────
      - name: Guard – input project ref matches DEV_PROJECT_REF secret
        run: |
          INPUT="${{ github.event.inputs.confirmed_project_ref }}"
          if [ "$INPUT" != "$DEV_PROJECT_REF" ]; then
            echo "::error::Input '${INPUT}' does not match DEV_PROJECT_REF."
            echo "::error::This workflow targets development only."
            exit 1
          fi
          echo "::notice::Input project ref confirmed."

      # ── Guard 2: verify project is not production via Management API ────────
      # Uses GET /v1/projects/{ref} — requires only "Project Settings: Read"
      # (project_admin_read). Fails closed on any non-200 response.
      - name: Guard – verify project is not production via Management API
        run: |
          HTTP_CODE=$(curl -o /tmp/project_meta.json -w "%{http_code}" -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${DEV_PROJECT_REF}" \
            || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Management API returned HTTP ${HTTP_CODE} for project ${DEV_PROJECT_REF}."
            echo "::error::Possible causes:"
            echo "::error::  401 – DEV_SUPABASE_ACCESS_TOKEN is invalid or expired"
            echo "::error::  403 – token lacks 'Project Settings: Read' scope for this project"
            echo "::error::  404 – DEV_PROJECT_REF does not match any project this token can see"
            echo "::error::Verify the token at app.supabase.com → account → Access tokens"
            echo "::error::Verify the token has 'Project Settings: Read' on project ${DEV_PROJECT_REF}"
            exit 1
          fi

          PROJECT_NAME=$(jq -r '.name // empty' /tmp/project_meta.json)

          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Management API response for ${DEV_PROJECT_REF} had no 'name' field."
            exit 1
          fi
          echo "::notice::Project ref resolves to: ${PROJECT_NAME}"

          LOWER=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          if echo "$LOWER" | grep -q 'prod'; then
            echo "::error::Project name '${PROJECT_NAME}' contains 'prod'. Aborting."
            exit 1
          fi
          echo "::notice::Production safety check passed."

          # ── Bind DEV_DB_URL to DEV_PROJECT_REF by hostname ───────────────────
          # The API already returned project_meta.json for DEV_PROJECT_REF above.
          # Extract the database host from the API response (field: db_host) and
          # compare it to the host embedded in DEV_DB_URL. A mismatch means
          # DEV_DB_URL points to a different project, and we abort.
          # This is stronger than migration-history matching.
          API_DB_HOST=$(jq -r '.db_host // empty' /tmp/project_meta.json)
          if [ -z "$API_DB_HOST" ]; then
            echo "::error::Management API response for ${DEV_PROJECT_REF} had no 'db_host' field."
            echo "::error::The project may be paused, initialising, or the token may lack scope."
            exit 1
          fi
          echo "API db_host: ${API_DB_HOST}"

          URL_HOST=$(echo "$DEV_DB_URL" \
            | sed 's|^[^@]*@||'        \
            | sed 's|:[0-9]*/.*$||')
          if [ -z "$URL_HOST" ]; then
            echo "::error::Could not extract host from DEV_DB_URL. Check the URL format."
            exit 1
          fi
          echo "URL host:    ${URL_HOST}"

          if [ "$API_DB_HOST" != "$URL_HOST" ]; then
            echo "::error::DEV_DB_URL host '${URL_HOST}' does not match"
            echo "::error::the Management API db_host '${API_DB_HOST}' for project ${DEV_PROJECT_REF}."
            echo "::error::DEV_DB_URL connects to a different project. Aborting."
            exit 1
          fi
          echo "::notice::DEV_DB_URL hostname confirmed for project ${DEV_PROJECT_REF}."

      # ── Guard 3: psql connectivity ──────────────────────────────────────────
      - name: Guard – verify psql can connect to DEV_DB_URL
        run: |
          echo "Testing psql connectivity …"
          psql "$DEV_DB_URL" --no-password -c "SELECT 1 AS connectivity_check;" \
            || { echo "::error::psql cannot connect to DEV_DB_URL."; exit 1; }
          echo "::notice::psql connectivity confirmed."

      # ── Checkout to get verification SQL ────────────────────────────────────
      # SQL is committed at supabase/deploy/verify_three_migrations.sql so the
      # workflow file stays YAML-safe (no inline heredoc containing SQL comments).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/dev-reconciliation

      # ── Run the verification SQL ────────────────────────────────────────────

      # ── Run the verification SQL ────────────────────────────────────────────
      - name: Run verification SQL against muriyar-ta-dev
        run: |
          echo "=== Running read-only verification against ${DEV_PROJECT_REF} ==="
          echo ""
          psql "$DEV_DB_URL" \
            --no-password \
            -v ON_ERROR_STOP=0 \
            --echo-errors \
            --file /tmp/verify_three_migrations.sql \
            2>&1 | tee /tmp/verification_results.txt

          echo ""
          echo "=== Raw output saved to artifact ==="

      # ── Parse and summarize results ─────────────────────────────────────────
      - name: Summarize verification results
        if: always()
        run: |
          RESULTS=/tmp/verification_results.txt

          # Count outcomes
          PASS_COUNT=$(grep -c '^PASS' "$RESULTS" || true)
          FAIL_COUNT=$(grep -c '^FAIL' "$RESULTS" || true)
          INFO_COUNT=$(grep -c '^INFO' "$RESULTS" || true)

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         MIGRATION VERIFICATION SUMMARY                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          printf "  PASS: %d   FAIL: %d   INFO: %d\n" "$PASS_COUNT" "$FAIL_COUNT" "$INFO_COUNT"
          echo ""

          echo "── PASS results ─────────────────────────────────────────────"
          grep '^PASS' "$RESULTS" | sed 's/^/  /' || echo "  (none)"
          echo ""

          echo "── FAIL results ─────────────────────────────────────────────"
          grep '^FAIL' "$RESULTS" | sed 's/^/  /' || echo "  (none)"
          echo ""

          echo "── Migration readiness ───────────────────────────────────────"
          # 20261001000000: needs B01-B17 all PASS
          # Use [0-9][0-9]* to match both single- and two-digit check IDs.
          B_FAILS=$(grep '^FAIL' "$RESULTS" | grep -cE ' \| B[0-9]' || true)
          C_FAILS=$(grep '^FAIL' "$RESULTS" | grep -cE ' \| C[0-9]' || true)
          D_FAILS=$(grep '^FAIL' "$RESULTS" | grep -cE ' \| D[0-9]' || true)

          if [ "$B_FAILS" -eq 0 ]; then
            echo "  20261001000000: ✓ All B-checks pass — effects confirmed"
            echo "::notice::20261001000000: All B-checks pass — effects confirmed in database."
          else
            echo "  20261001000000: ✗ $B_FAILS B-check(s) failed — DO NOT mark applied"
            echo "::error::20261001000000: $B_FAILS B-check(s) failed — effects NOT fully confirmed."
          fi

          if [ "$C_FAILS" -eq 0 ]; then
            echo "  20261001120000: ✓ All C-checks pass — effects confirmed"
            echo "::notice::20261001120000: All C-checks pass — effects confirmed in database."
          else
            echo "  20261001120000: ✗ $C_FAILS C-check(s) failed — DO NOT mark applied"
            echo "::error::20261001120000: $C_FAILS C-check(s) failed — effects NOT fully confirmed."
          fi

          if [ "$D_FAILS" -eq 0 ]; then
            echo "  20261001130000: ✓ All D-checks pass — effects confirmed"
            echo "::notice::20261001130000: All D-checks pass — effects confirmed in database."
          else
            echo "  20261001130000: ✗ $D_FAILS D-check(s) failed — DO NOT mark applied"
            echo "::error::20261001130000: $D_FAILS D-check(s) failed — effects NOT fully confirmed."
          fi

          echo ""
          echo "Full output (including INFO rows and function sources) is in the"
          echo "verification-results artifact attached to this run."
          echo ""

          # Exit non-zero only if there were database errors (psql errors), not
          # FAIL rows — FAIL rows are expected until we confirm effects.
          # We let the workflow succeed so the artifact is always uploaded.

      # ── Upload full results ─────────────────────────────────────────────────
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: /tmp/verification_results.txt
          retention-days: 30
