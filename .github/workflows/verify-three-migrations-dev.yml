name: Verify Three Pending Migrations (Development)

# READ-ONLY verification workflow.
# Checks whether the database effects of migrations 20261001000000,
# 20261001120000, and 20261001130000 are already present in muriyar-ta-dev.
#
# This workflow NEVER modifies schema_migrations, applies migrations,
# runs INSERT/UPDATE/DELETE, or touches production.
#
# Results: PASS | <id> | description
#          FAIL | <id> | description | detail  (investigate before acting)
#          INFO | <id> | ...          (manual comparison; see artifact)
#
# The SQL lives in supabase/deploy/verify_three_migrations.sql on main.

on:
  workflow_dispatch:
    inputs:
      confirmed_project_ref:
        description: >
          Type the dev project ref to confirm target (must match DEV_PROJECT_REF).
        required: true
        type: string

concurrency:
  group: verify-three-migrations-dev
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  verify:
    name: Verify three pending migration effects in muriyar-ta-dev
    runs-on: ubuntu-22.04
    environment: development

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
      DEV_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}

    steps:
      - name: Guard - verify required secrets are present
        run: |
          MISSING=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && MISSING="${MISSING} DEV_SUPABASE_ACCESS_TOKEN"
          [ -z "$DEV_DB_URL" ]            && MISSING="${MISSING} DEV_DB_URL"
          [ -z "$DEV_PROJECT_REF" ]       && MISSING="${MISSING} DEV_PROJECT_REF"
          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets are missing or empty:${MISSING}"
            echo "::error::Add them to Settings -> Environments -> development -> Environment secrets"
            exit 1
          fi
          echo "::notice::All required secrets are present."

      - name: Guard - input project ref matches DEV_PROJECT_REF secret
        run: |
          INPUT="${{ github.event.inputs.confirmed_project_ref }}"
          if [ "$INPUT" != "$DEV_PROJECT_REF" ]; then
            echo "::error::Input '${INPUT}' does not match DEV_PROJECT_REF."
            echo "::error::This workflow targets development only."
            exit 1
          fi
          echo "::notice::Input project ref confirmed."

      - name: Guard - verify project is not production via Management API
        run: |
          HTTP_CODE=$(curl -o /tmp/project_meta.json -w "%{http_code}" -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${DEV_PROJECT_REF}" \
            || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Management API returned HTTP ${HTTP_CODE} for project ${DEV_PROJECT_REF}."
            echo "::error::  401 - token invalid or expired"
            echo "::error::  403 - token lacks Project Settings: Read scope"
            echo "::error::  404 - DEV_PROJECT_REF not found for this token"
            exit 1
          fi
          PROJECT_NAME=$(jq -r '.name // empty' /tmp/project_meta.json)
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Management API response had no name field."
            exit 1
          fi
          echo "::notice::Project ref resolves to: ${PROJECT_NAME}"
          LOWER=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          if echo "$LOWER" | grep -q 'prod'; then
            echo "::error::Project name '${PROJECT_NAME}' contains 'prod'. Aborting."
            exit 1
          fi
          echo "::notice::Production safety check passed."

      - name: Guard - verify psql can connect to DEV_DB_URL
        run: |
          psql "$DEV_DB_URL" --no-password -c "SELECT 1 AS connectivity_check;" \
            || { echo "::error::psql cannot connect to DEV_DB_URL."; exit 1; }
          echo "::notice::psql connectivity confirmed."

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Run verification SQL against muriyar-ta-dev
        run: |
          echo "=== Running read-only verification against ${DEV_PROJECT_REF} ==="
          psql "$DEV_DB_URL" \
            --no-password \
            -v ON_ERROR_STOP=0 \
            --echo-errors \
            --file supabase/deploy/verify_three_migrations.sql \
            2>&1 | tee /tmp/verification_results.txt
          echo "=== Verification complete ==="

      - name: Summarize verification results
        if: always()
        run: |
          RESULTS=/tmp/verification_results.txt
          PASS_COUNT=$(grep -c '^PASS' "$RESULTS" || true)
          FAIL_COUNT=$(grep -c '^FAIL' "$RESULTS" || true)
          INFO_COUNT=$(grep -c '^INFO' "$RESULTS" || true)

          echo ""
          echo "======================================================"
          echo "         MIGRATION VERIFICATION SUMMARY"
          echo "======================================================"
          printf "  PASS: %d   FAIL: %d   INFO: %d\n\n" "$PASS_COUNT" "$FAIL_COUNT" "$INFO_COUNT"

          echo "-- PASS results --------------------------------------"
          grep '^PASS' "$RESULTS" | sed 's/^/  /' || echo "  (none)"

          echo ""
          echo "-- FAIL results --------------------------------------"
          grep '^FAIL' "$RESULTS" | sed 's/^/  /' || echo "  (none)"

          echo ""
          echo "-- Migration readiness -------------------------------"
          B_FAILS=$(grep '^FAIL' "$RESULTS" | grep -c ' | B[0-9]' || true)
          C_FAILS=$(grep '^FAIL' "$RESULTS" | grep -c ' | C[0-9]' || true)
          D_FAILS=$(grep '^FAIL' "$RESULTS" | grep -c ' | D[0-9]' || true)

          if [ "$B_FAILS" -eq 0 ]; then
            echo "  20261001000000: PASS - All B-checks pass - effects confirmed"
            echo "::notice::20261001000000: All B-checks pass."
          else
            echo "  20261001000000: FAIL - ${B_FAILS} B-check(s) failed - DO NOT mark applied"
            echo "::error::20261001000000: ${B_FAILS} B-check(s) failed."
          fi

          if [ "$C_FAILS" -eq 0 ]; then
            echo "  20261001120000: PASS - All C-checks pass - effects confirmed"
            echo "::notice::20261001120000: All C-checks pass."
          else
            echo "  20261001120000: FAIL - ${C_FAILS} C-check(s) failed - DO NOT mark applied"
            echo "::error::20261001120000: ${C_FAILS} C-check(s) failed."
          fi

          if [ "$D_FAILS" -eq 0 ]; then
            echo "  20261001130000: PASS - All D-checks pass - effects confirmed"
            echo "::notice::20261001130000: All D-checks pass."
          else
            echo "  20261001130000: FAIL - ${D_FAILS} D-check(s) failed - DO NOT mark applied"
            echo "::error::20261001130000: ${D_FAILS} D-check(s) failed."
          fi

          echo ""
          echo "Full output with INFO rows and function sources is in the"
          echo "verification-results artifact attached to this run."

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: /tmp/verification_results.txt
          retention-days: 30
