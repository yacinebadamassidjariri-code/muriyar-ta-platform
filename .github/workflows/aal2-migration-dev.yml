name: AAL2 Migration – Preflight (Development)

# ── Trigger ──────────────────────────────────────────────────────────────────
# Read-only preflight: inspects the dev database and reports what the apply
# workflow will do.  Runs manually before triggering aal2-migration-apply-dev.
# Never mutates the database.
on:
  workflow_dispatch:
    inputs:
      confirmed_project_ref:
        description: >
          Type the dev project ref to confirm target (must match DEV_PROJECT_REF).
        required: true
        type: string

concurrency:
  group: aal2-migration-dev
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  preflight:
    name: Preflight – verify target and inspect schema
    runs-on: ubuntu-22.04
    environment: development

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
      DEV_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}

    steps:
      - name: Install Supabase CLI v2.120.0
        run: |
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v2.120.0/supabase_linux_amd64.tar.gz" \
            -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Checkout dev/aal2-enforcement
        uses: actions/checkout@v4
        with:
          ref: dev/aal2-enforcement

      # ── Guard 1: input must match secret ────────────────────────────────────
      - name: Guard – input project ref matches DEV_PROJECT_REF secret
        run: |
          INPUT="${{ github.event.inputs.confirmed_project_ref }}"
          if [ -z "$DEV_PROJECT_REF" ]; then
            echo "::error::DEV_PROJECT_REF secret is not set."
            exit 1
          fi
          if [ "$INPUT" != "$DEV_PROJECT_REF" ]; then
            echo "::error::Input '${INPUT}' does not match DEV_PROJECT_REF."
            echo "::error::This workflow targets development only."
            exit 1
          fi
          echo "::notice::Input project ref confirmed."

      # ── Guard 2: verify DEV_PROJECT_REF is not production via Management API ──
      # Uses the Supabase Management API to look up the project by ref ID.
      # This works regardless of DB URL format (direct port 5432 or pooler 6543)
      # because it does not parse the connection string.
      - name: Guard – verify project is not production via Management API
        run: |
          # jq is pre-installed on ubuntu-22.04 GitHub runners.
          PROJECT_NAME=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects" \
            | jq -r --arg ref "$DEV_PROJECT_REF" \
                '.[] | select(.id == $ref) | .name // empty')

          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::DEV_PROJECT_REF '${DEV_PROJECT_REF}' not found in projects for this token."
            echo "::error::Check DEV_SUPABASE_ACCESS_TOKEN has access to the dev project."
            exit 1
          fi
          echo "::notice::DEV_PROJECT_REF resolves to: ${PROJECT_NAME}"

          LOWER=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          if echo "$LOWER" | grep -q 'prod'; then
            echo "::error::Project name '${PROJECT_NAME}' contains 'prod'. Aborting."
            exit 1
          fi

          echo "::notice::Testing psql connectivity to DEV_DB_URL …"
          psql "$DEV_DB_URL" --no-password -c "SELECT 1 AS connectivity_check;" \
            || { echo "::error::psql cannot connect to DEV_DB_URL."; exit 1; }
          echo "::notice::psql connectivity confirmed."

      # ── Preflight queries ───────────────────────────────────────────────────
      - name: Preflight – migration ledger
        run: |
          echo "=== Applied migrations on remote ==="
          psql "$DEV_DB_URL" --no-password -c \
            "SELECT version, name
             FROM supabase_migrations.schema_migrations
             ORDER BY version;"

      - name: Preflight – pending migrations (what apply will run)
        id: pending
        run: |
          echo "=== Pending migrations (dry-run) ==="
          supabase db push \
            --project-ref "$DEV_PROJECT_REF" \
            --dry-run \
            2>&1 | tee /tmp/dry_run.txt || true
          cat /tmp/dry_run.txt

          if grep -q "20261010000000_aal2_enforcement" /tmp/dry_run.txt; then
            echo "::notice::AAL2 migration is pending."
          else
            echo "::notice::AAL2 migration not found in pending list (may already be applied)."
          fi

      # ── Guard 3: no unexpected pending migrations ────────────────────────────
      # Compares local migration files against what the CLI reports as pending.
      # Any pending migration other than 20261010000000_aal2_enforcement is
      # unexpected and must be resolved before applying.
      - name: Guard – no unexpected pending migrations
        run: |
          # Get the list of applied migration versions from the remote.
          APPLIED=$(psql "$DEV_DB_URL" --no-password --tuples-only \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            | tr -d ' ' | grep -E '^[0-9]{14}$')

          # Get the list of local migration versions from the supabase/migrations/ directory.
          LOCAL=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} .sql \
            | grep -E '^[0-9]{14}_' \
            | sed 's/_[^_].*//' \
            | sort)

          echo "=== Applied on remote ==="
          echo "$APPLIED"
          echo "=== Local migration files ==="
          echo "$LOCAL"

          # Find local migrations not yet applied on remote.
          PENDING=$(comm -23 \
            <(echo "$LOCAL" | sort) \
            <(echo "$APPLIED" | sort))

          echo "=== Pending (local but not on remote) ==="
          echo "${PENDING:-none}"

          # Only our AAL2 migration should be pending.
          UNEXPECTED=$(echo "$PENDING" | grep -v "^20261010000000$" | grep -E '^[0-9]{14}$' || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected pending migrations found:"
            echo "$UNEXPECTED"
            echo "::error::Resolve these before applying the AAL2 migration."
            exit 1
          fi
          echo "::notice::Pending-migration check passed."

      - name: Preflight – active user roles
        run: |
          echo "=== Active user roles ==="
          psql "$DEV_DB_URL" --no-password -c \
            "SELECT r.name, count(*) AS active_users
             FROM public.users u
             JOIN public.user_role_assignments ura ON ura.user_id = u.user_id
               AND ura.revoked_at IS NULL
             JOIN public.roles r ON r.role_id = ura.role_id
             GROUP BY r.name ORDER BY r.name;"

      - name: Preflight – key RPC existence and require_aal2 state
        run: |
          echo "=== Key RPCs ==="
          psql "$DEV_DB_URL" --no-password -c \
            "SELECT
               to_regprocedure('public.review_get_submission(uuid)')            AS review_get_submission,
               to_regprocedure('public.story_admin_workspace(uuid)')            AS story_admin_workspace,
               to_regprocedure('public.story_admin_bulk(uuid[],text,uuid,text)') AS story_admin_bulk,
               to_regclass('public.raw_submissions')                            AS raw_submissions;"

          echo "=== require_aal2 current state (null rows = not yet applied) ==="
          psql "$DEV_DB_URL" --no-password -c \
            "SELECT p.proname, p.prosecdef AS security_definer,
                    p.prosrc LIKE '%aal2_required%' AS contains_aal2_check
             FROM pg_proc p
             JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'public' AND p.proname = 'require_aal2';"

      - name: Preflight summary
        run: |
          echo "::notice::Preflight complete. If all checks above passed, run aal2-migration-apply-dev to apply."
