name: Q&A Migration – Preflight (Development)

# ── Trigger ──────────────────────────────────────────────────────────────────
# Run on pushes to feature/ask-muriyar-ta that change Q&A migration files,
# or manually.  This workflow ONLY checks — it never writes to the database.
#
# WHAT THIS DOES:
#   1. Checks that DEV_PROJECT_REF is not a production project.
#   2. Verifies DEV_DB_URL connects to DEV_PROJECT_REF (migration history cross-check).
#   3. Lists pending Q&A migrations (should be exactly the four new ones).
#   4. Verifies the AAL2 migration is already applied (prerequisite check).
#   5. Dry-runs the migrations with supabase db push --dry-run.
#   6. Runs the Q&A test suite (05_qa_tests.sql) as a preflight smoke test
#      against current dev state (may not pass until migrations are applied).
#
# PREREQUISITE: The AAL2 migration (20261010000000) must be applied in dev.
#               Run aal2-migration-apply-dev first if it has not been applied.
on:
  push:
    branches:
      - feature/ask-muriyar-ta
    paths:
      - 'supabase/migrations/20261010100*.sql'
      - 'supabase/deploy/05_qa_tests.sql'
      - '.github/workflows/qa-migration-dev.yml'
  workflow_dispatch:

concurrency:
  group: qa-migration-preflight-dev
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  preflight:
    name: Q&A migration preflight checks
    runs-on: ubuntu-22.04
    environment: development

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
      DEV_PROJECT_REF: ${{ secrets.DEV_PROJECT_REF }}

    steps:
      - name: Install Supabase CLI v2.120.0
        run: |
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v2.120.0/supabase_linux_amd64.tar.gz" \
            -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Checkout feature/ask-muriyar-ta
        uses: actions/checkout@v4
        with:
          ref: feature/ask-muriyar-ta

      # ── Guard 1: API cross-check — DEV_PROJECT_REF is not a prod project ────
      - name: Guard – verify project is not production via Management API
        run: |
          PROJECT_NAME=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects" \
            | jq -r --arg ref "$DEV_PROJECT_REF" \
                '.[] | select(.id == $ref) | .name // empty')

          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::DEV_PROJECT_REF '${DEV_PROJECT_REF}' not found via Management API."
            exit 1
          fi
          echo "::notice::Project ref resolves to: ${PROJECT_NAME}"

          LOWER=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          if echo "$LOWER" | grep -q 'prod'; then
            echo "::error::Project name '${PROJECT_NAME}' contains 'prod'. Aborting."
            exit 1
          fi

      # ── Guard 2: Verify DEV_DB_URL connects to DEV_PROJECT_REF ─────────────
      - name: Guard – verify DEV_DB_URL connects to DEV_PROJECT_REF
        run: |
          API_VERSIONS=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${DEV_PROJECT_REF}/database/migrations" \
            | jq -r 'if type == "array" then .[].version else error("unexpected response") end' \
            | sort)

          if [ -z "$API_VERSIONS" ]; then
            echo "::error::Management API returned no migrations for ${DEV_PROJECT_REF}."
            echo "::error::The project may be paused or the access token may lack permission."
            exit 1
          fi

          DB_VERSIONS=$(psql "$DEV_DB_URL" --no-password --tuples-only \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            | tr -d ' ' | grep -E '^[0-9]{14}$' | sort)

          if [ -z "$DB_VERSIONS" ]; then
            echo "::error::psql returned no migrations from DEV_DB_URL."
            echo "::error::Check the connection string and database password."
            exit 1
          fi

          echo "API migration count: $(echo "$API_VERSIONS" | wc -l | tr -d ' ')"
          echo "DB  migration count: $(echo "$DB_VERSIONS"  | wc -l | tr -d ' ')"

          ONLY_IN_API=$(comm -23 <(echo "$API_VERSIONS") <(echo "$DB_VERSIONS") || true)
          ONLY_IN_DB=$(comm -13  <(echo "$API_VERSIONS") <(echo "$DB_VERSIONS") || true)

          if [ -n "$ONLY_IN_API" ] || [ -n "$ONLY_IN_DB" ]; then
            echo "::error::Migration history mismatch between API and DEV_DB_URL."
            [ -n "$ONLY_IN_API" ] && echo "::error::In API but not in DB: ${ONLY_IN_API}"
            [ -n "$ONLY_IN_DB"  ] && echo "::error::In DB but not in API: ${ONLY_IN_DB}"
            echo "::error::DEV_DB_URL does not appear to connect to project ${DEV_PROJECT_REF}."
            exit 1
          fi
          echo "::notice::DEV_DB_URL migration history matches API for ${DEV_PROJECT_REF}."

      # ── Guard 3: AAL2 migration must already be applied ──────────────────────
      - name: Guard – verify AAL2 migration (20261010000000) is applied
        run: |
          APPLIED=$(psql "$DEV_DB_URL" --no-password --tuples-only \
            -c "SELECT version FROM supabase_migrations.schema_migrations
                WHERE version = '20261010000000';" \
            | tr -d ' ')

          if [ -z "$APPLIED" ]; then
            echo "::error::AAL2 migration (20261010000000_aal2_enforcement) is not applied."
            echo "::error::Run the aal2-migration-apply-dev workflow first."
            exit 1
          fi

          # Verify require_aal2() actually exists in the schema.
          FUNC_EXISTS=$(psql "$DEV_DB_URL" --no-password --tuples-only -c \
            "SELECT proname FROM pg_proc p
             JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'public' AND p.proname = 'require_aal2';" \
            | tr -d ' ')

          if [ -z "$FUNC_EXISTS" ]; then
            echo "::error::require_aal2() not found in public schema even though migration is recorded."
            echo "::error::The AAL2 migration may have been rolled back or the DB is inconsistent."
            exit 1
          fi

          echo "::notice::AAL2 migration applied and require_aal2() exists."

      # ── Pending Q&A migrations ────────────────────────────────────────────────
      - name: List pending Q&A migrations
        run: |
          APPLIED=$(psql "$DEV_DB_URL" --no-password --tuples-only \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            | tr -d ' ' | grep -E '^[0-9]{14}$')

          LOCAL=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} .sql \
            | grep -E '^[0-9]{14}_' \
            | sed 's/_[^_].*//' \
            | sort)

          PENDING=$(comm -23 \
            <(echo "$LOCAL" | sort) \
            <(echo "$APPLIED" | sort))

          echo "All pending migrations:"
          echo "${PENDING:-  (none)}"

          # Warn if any non-Q&A migrations are pending.
          QA_VERSIONS="20261010100000
20261010100001
20261010100002
20261010100003"

          NON_QA=$(echo "$PENDING" | grep -vE '^(20261010100[0-9]{3})?$' | grep -E '^[0-9]{14}$' || true)
          if [ -n "$NON_QA" ]; then
            echo "::warning::Non-Q&A migrations are pending: ${NON_QA}"
            echo "::warning::These should be applied or resolved before the Q&A apply workflow runs."
          fi

          QA_PENDING=$(echo "$PENDING" | grep -E '^20261010100[0-9]{3}$' || true)
          echo "::notice::Q&A migrations pending: ${QA_PENDING:-none}"

      # ── Dry run ─────────────────────────────────────────────────────────────
      - name: Dry-run Q&A migrations (supabase db push --dry-run)
        run: |
          echo "Dry-running pending migrations against ${DEV_PROJECT_REF} …"
          supabase db push \
            --project-ref "$DEV_PROJECT_REF" \
            --dry-run \
            2>&1 | tee /tmp/dryrun_output.txt || true

          # Not all CLI versions exit non-zero on dry-run SQL errors — capture output for review.
          echo "::notice::Dry-run complete. Review output above for SQL errors."

      - name: Upload dry-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-dryrun-output
          path: /tmp/dryrun_output.txt
          retention-days: 14

      # ── Preflight test suite ─────────────────────────────────────────────────
      # Runs 05_qa_tests.sql against current dev state.
      # Expects some tests to fail if migrations are not yet applied —
      # the preflight is informational only (exit 0 even on test failures).
      # The apply workflow re-runs these with ON_ERROR_STOP=1 after applying.
      - name: Run Q&A preflight test suite (informational)
        run: |
          echo "=== Running 05_qa_tests.sql (preflight — informational only) ==="
          psql "$DEV_DB_URL" \
            --no-password \
            --echo-queries \
            -v ON_ERROR_STOP=1 \
            --file supabase/deploy/05_qa_tests.sql \
            2>&1 | tee /tmp/qa_preflight_output.txt || true
          # `|| true` here because migrations may not yet be applied;
          # the output is captured for review.  The apply workflow runs
          # this with exit-on-failure after applying.

          # Print SUITE line if present.
          SUITE_LINE=$(grep "^SUITE: " /tmp/qa_preflight_output.txt | tail -1 || true)
          if [ -n "$SUITE_LINE" ]; then
            echo "::notice::Preflight ${SUITE_LINE}"
          else
            echo "::notice::No SUITE summary in output — Q&A RPCs may not yet be applied."
          fi

      - name: Upload preflight test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-preflight-test-output
          path: /tmp/qa_preflight_output.txt
          retention-days: 14
